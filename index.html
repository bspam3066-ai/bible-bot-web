<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catholic Bible & Reflection Web App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      color: var(--accent);
      text-align: center;
      margin-bottom: 25px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .output-box {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
      color: #e2e8f0;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      margin-top: 50px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>✝️ Catholic Bible & Reflection App</h1>
      
      <div class="button-group">
        <button onclick="handleRandomVerse()">📖 Get Random Verse (.verse)</button>
        <button onclick="handleMessageFromGod()">❤️ Message of Encouragement (.message from god)</button>
        <button onclick="handleDailyReading()">📅 Today's Reading (.test)</button>
      </div>

      <div id="output" class="output-box">
        <div class="placeholder">Select an option above to load scripture or reflections...</div>
      </div>
    </div>
  </div>

  <!-- Import your extracted bot arrays and logic script -->
  <script src="botData.js"></script>
</body>
</html>
