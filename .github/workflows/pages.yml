name: Deploy Verbum Dei to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Retry the daily OLM refresh several times; all times are UTC.
    - cron: "15 1,4,7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the OLM scraper dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/olm-deps" cheerio@1.0.0
          ln -s "$RUNNER_TEMP/olm-deps/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Check whether today's Gospel explanation is already saved
        id: gospel-cache
        run: |
          TODAY="$(TZ=Asia/Beirut date +%F)"
          if [ -f data/gospel-explanation.json ] && grep -q "\"date\": \"$TODAY\"" data/gospel-explanation.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the free local Gospel explanation model
        if: steps.gospel-cache.outputs.needed == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b

      - name: Assemble static website
        run: |
          mkdir -p _site/data
          cp index.html app.js botData.js prayers.js saints.js style.css _site/
          node scripts/generate-data.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
